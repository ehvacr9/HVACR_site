<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>風機定律回歸測試</title></head>
<body>
  <h1>風機定律回歸測試</h1>
  <pre id="results" role="status">Running...</pre>
  <script type="module">
    import { calculateFanLaws, lawSets } from "../assets/fan-laws.js";
    const output = document.querySelector("#results");
    let checks = 0;
    const assert = (condition, label) => { checks++; if (!condition) throw new Error(label); };
    const close = (actual, expected, label) => assert(Math.abs(actual - expected) <= Math.max(1e-8, Math.abs(expected) * 1e-10), label);
    const base = { diameter: .5, speed: 1200, flow: 10000, pressure: 500, power: 3, density: 1.204 };
    const frame = document.createElement("iframe");
    frame.title = "Fan laws interaction tests";
    frame.style.cssText = "position:fixed;left:-10000px;width:1100px;height:1000px";
    try {
      for (const density of [1.204, 998.2]) {
        for (const d of [.8, 1, 1.3]) {
          for (const n of [.5, 1, 1.2]) {
            for (const rho of [.8, 1, 1.3]) {
              const b = { ...base, density };
              const target = { diameter: b.diameter * d, density: density * rho,
                speed: b.speed * n, flow: b.flow * d ** 3 * n,
                pressure: b.pressure * d ** 2 * n ** 2 * rho, power: b.power * d ** 5 * n ** 3 * rho };
              for (const law of ["speed", "pressure", "flow"]) {
                const result = calculateFanLaws({ law, base: b, target });
                for (const key of ["flow", "pressure", "speed", "power"]) close(result[key], target[key], `${law} ${key} all ratios`);
              }
            }
          }
        }
      }
      const sample = calculateFanLaws({ law: "speed", base, target: { diameter: .5, density: 1.204, speed: 960 } });
      close(sample.flow, 8000, "20% speed reduction yields 8000 m3/h");
      close(sample.pressure, 320, "20% speed reduction yields 320 Pa");
      close(sample.power, 1.536, "20% speed reduction yields 1.536 kW");
      for (const [law, known] of [["pressure", "pressure"], ["flow", "flow"]]) {
        for (const bad of [0, -1, NaN, Infinity]) {
          let rejected = false;
          try { calculateFanLaws({ law, base, target: { diameter: .5, density: 1.204, [known]: bad } }); }
          catch (error) { rejected = error instanceof RangeError; }
          assert(rejected, `Reject invalid ${law} target`);
        }
      }
      for (const input of [
        { law: "unknown", base, target: {} },
        { law: "speed", base, target: { diameter: 1e200, density: 1.204, speed: 960 } },
      ]) {
        let rejected = false;
        try { calculateFanLaws(input); } catch (error) { rejected = error instanceof RangeError; }
        assert(rejected, "Reject unsupported law or overflow");
      }
      for (const bad of [0, -1, NaN, Infinity]) {
        for (const side of ["base", "target"]) {
          const keys = side === "base" ? Object.keys(base) : ["diameter", "density", "speed"];
          for (const key of keys) {
            const input = { law: "speed", base: { ...base }, target: { diameter: .5, density: 1.204, speed: 960 } };
            input[side][key] = bad;
            let rejected = false;
            try { calculateFanLaws(input); } catch (error) { rejected = error instanceof RangeError; }
            assert(rejected, `Reject invalid ${side} ${key}`);
          }
        }
      }
      const tools = new DOMParser().parseFromString(await (await fetch("../tools.html")).text(), "text/html");
      assert(tools.querySelector('[aria-labelledby="engineering-title"] a[href="fan-laws.html"]'), "Tool listed in engineering applications");
      document.body.append(frame);
      await new Promise((resolve) => { frame.onload = resolve; frame.src = `../fan-laws.html?test=${Date.now()}`; });
      const doc = frame.contentDocument;
      const style = frame.contentWindow.getComputedStyle.bind(frame.contentWindow);
      assert(doc.querySelector("#result-warning").hidden
        && doc.querySelector(".calculation-notes").getBoundingClientRect().height === 0,
      "Hidden engineering warning leaves no blank space below the calculator");
      assert(doc.querySelector(".formula-panel").getBoundingClientRect().top
        - doc.querySelector("#fan-form").getBoundingClientRect().bottom <= 16,
      "Formula panel sits close to the calculator");
      assert(doc.querySelector("#fan-form").children.length === 4
        && [...doc.querySelector("#fan-form").children].map((element) => element.className || element.id)
          .join("|") === "setup-panel|grid condition-grid|form-actions|calculation-notes",
      "Calculator inputs, action and guidance form one unified card");
      assert(style(doc.querySelector(".condition-grid fieldset")).borderTopWidth === "0px"
        && style(doc.querySelector(".condition-grid fieldset + fieldset")).borderLeftWidth === "1px",
      "Prototype and target fields use a shared divider instead of separate cards");
      assert(doc.querySelectorAll("main > .panel").length === 2,
        "Calculator and formula remain the only main panels");
      assert(doc.querySelector(".formula-panel h2").textContent === "本組計算公式"
        && doc.querySelectorAll("#formulas .formula").length === 3,
      "Formula panel has a left-aligned equations area");
      assert(doc.querySelector(".formula-symbols").textContent.includes("符號說明")
        && doc.querySelector(".formula-symbols").textContent.includes("ρ：密度"),
      "Formula symbol definitions are in a distinct right-side area");
      assert(doc.querySelectorAll(".formula-symbols li").length === 6
        && [...doc.querySelectorAll(".formula-symbols li")].every((item) =>
          style(item).textAlign === "left" && item.getBoundingClientRect().height > 0),
      "Formula symbols are left-aligned on separate lines");
      assert(Number.parseFloat(style(doc.querySelector(".formula-content")).paddingTop) <= 18
        && Number.parseFloat(style(doc.querySelector(".formula-symbols")).lineHeight) <= 21
        && Number.parseFloat(style(doc.querySelector("#formulas")).rowGap) <= 4,
      "Formula and symbol layout uses compact spacing");
      assert(!doc.querySelector("main").textContent.includes("原型參數（下標 1）")
        && !doc.querySelector("main").textContent.includes("目標工況（下標 2）"),
      "Intro omits redundant subscript parentheticals");
      assert(doc.querySelectorAll(".condition-grid .parameter-field").length === 12,
        "All prototype and target values use aligned parameter rows");
      assert(doc.querySelector(".density-reference").textContent === "密度預設為乾空氣參考值 1.204 kg/m³（20°C、101.325 kPa）。"
        && !doc.querySelector('a[href="humid-air.html"]'),
      "Density reference is retained without the property-tool link");
      assert(!doc.querySelector(".calculation-notes h2")
        && !doc.body.textContent.includes("直徑、密度與本組已知條件可輸入"),
      "Remove the operation guide heading and paragraph");
      const lawSelect = doc.querySelector("#law").getBoundingClientRect();
      const setupPanel = doc.querySelector(".setup-panel").getBoundingClientRect();
      assert(lawSelect.width <= 360 && lawSelect.right <= setupPanel.right,
        "Law selector has a compact width");
      assert(!doc.querySelector("#fluid")
        && doc.querySelector("#base-density").value === "1.204"
        && doc.querySelector("#target-density").value === "1.204",
      "Remove fluid selection and preserve air density defaults");
      const pageText = doc.body.textContent + doc.querySelector('meta[name="description"]').content;
      const excludedTerms = ["\u6c34", "\u6cf5\u6d66", "\u6c34\u6d41\u91cf"];
      assert(!excludedTerms.some((term) => pageText.includes(term)),
        "Calculator page omits unrelated fluid terms");
      assert(!doc.querySelector('[aria-label="適用限制"]')
        && !doc.body.textContent.includes("Law 1 適合已知轉速")
        && !doc.body.textContent.includes("本工具供教育與初步估算"),
      "Remove the requested usage and limitation bullets");
      assert(doc.querySelector("footer").innerHTML.trim() === tools.querySelector("footer").innerHTML.trim(),
        "Footer matches tool overview branding and copyright");
      assert(doc.querySelector('label[for="base-speed"]').textContent.includes("N₁")
        && doc.querySelector('label[for="target-speed"]').textContent.includes("N₂")
        && doc.querySelector('label[for="target-power"]').textContent.includes("W₂"),
      "Prototype uses subscript 1 and target uses subscript 2");
      assert(lawSets.speed.formulas[0] === "1a：Q₂ = Q₁ (D₂/D₁)³ (N₂/N₁)"
        && lawSets.pressure.formulas[1] === "2b：N₂ = N₁ (D₁/D₂) (Δp₂/Δp₁)½ (ρ₁/ρ₂)½"
        && lawSets.flow.formulas[2] === "3c：W₂ = W₁ (D₁/D₂)⁴ (Q₂/Q₁)³ (ρ₂/ρ₁)",
      "Displayed formulas solve target 2 from prototype 1");
      const set = (selector, value) => {
        doc.querySelector(selector).value = value;
        doc.querySelector(selector).dispatchEvent(new frame.contentWindow.Event("change", { bubbles: true }));
      };
      const submit = () => doc.querySelector("button[type=submit]").click();
      const outputs = () => [...doc.querySelectorAll("#target-conditions input:disabled")];
      const cleared = () => outputs().every((input) => input.value === "");
      assert(cleared() && outputs().length === 3, "Three empty locked outputs initially visible");
      assert(doc.querySelector("#target-speed").value === ""
        && !doc.querySelector("#target-speed").hasAttribute("value"),
      "Target speed has no preset value");
      assert(!doc.querySelector("#results") && doc.querySelector("#target-conditions #target-power"),
        "Results integrated into target conditions without separate result table");
      set("#target-speed", "960");
      submit();
      assert(doc.querySelector("#target-power").value === "1.536", "Speed result renders in target power");
      close(doc.querySelector("#target-flow").valueAsNumber, 8000, "Target flow displayed");
      close(doc.querySelector("#target-pressure").valueAsNumber, 320, "Target pressure displayed");
      assert(doc.querySelector("#target-speed").value === "960", "Known target input preserved");
      for (const law of ["pressure", "flow", "speed"]) {
        set("#law", law);
        assert(cleared(), "Changing law clears stale output");
        assert(doc.querySelector(`#target-${law}`).required && !doc.querySelector(`#target-${law}`).disabled, "Only known input active");
        assert(outputs().length === 3 && outputs().every((input) => !input.required && !input.closest("[data-known]").hidden),
          "All three computed outputs visible and locked");
        for (const input of outputs()) {
          const style = frame.contentWindow.getComputedStyle(input);
          assert(style.backgroundColor === "rgb(236, 236, 236)" && style.color === "rgb(163, 40, 40)",
            "Computed outputs have gray background and red text");
        }
        assert(!doc.querySelector("#target-diameter").disabled && !doc.querySelector("#target-density").disabled,
          "Target diameter and density stay editable");
        assert(doc.querySelector("#law-hint").textContent.length > 20 && doc.querySelectorAll("#formulas .formula").length === 3, "Guidance and all three laws displayed");
        set(`#target-${law}`, { pressure: "320", flow: "8000", speed: "960" }[law]);
        submit();
        assert(doc.querySelector("#target-power").value === "1.536", "Equivalent target values match each law");
      }
      set("#base-density", "998.2");
      set("#target-density", "998.2");
      submit();
      assert(doc.querySelector("#result-warning").textContent.includes("系統曲線"), "Engineering verification warning visible");
      set("#base-speed", "0");
      submit();
      assert(!doc.querySelector("#error").hidden && cleared(), "Zero values show explicit error and no stale result");
      set("#base-speed", "");
      submit();
      assert(cleared() && doc.querySelector("#result-status").textContent.includes("無效或缺漏"), "Native invalid input clears outputs and reports error");
      set("#base-speed", "1200");
      submit();
      for (const width of [320, 390, 1280]) {
        frame.style.width = `${width}px`;
        await new Promise((resolve) => setTimeout(resolve, 50));
        assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth, `No page overflow ${width}`);
        const button = doc.querySelector("button[type=submit]");
        const densityReference = doc.querySelector(".density-reference").getBoundingClientRect();
        assert(densityReference.top >= button.getBoundingClientRect().bottom,
          `Density reference sits below the calculation button ${width}`);
        for (const field of doc.querySelectorAll(".condition-grid .parameter-field")) {
          const label = field.querySelector("label").getBoundingClientRect();
          const input = field.querySelector("input").getBoundingClientRect();
          const fieldset = field.closest("fieldset").getBoundingClientRect();
          assert(input.left >= label.right - 1
            && Math.abs((input.top + input.height / 2) - (label.top + label.height / 2)) < 2,
            `Parameter label and input align side by side ${width}`);
          assert(input.width < fieldset.width * 0.6,
            `Parameter input remains narrower than its fieldset ${width}`);
        }
        const formulaContent = doc.querySelector(".formula-content").getBoundingClientRect();
        const formulaSymbols = doc.querySelector(".formula-symbols").getBoundingClientRect();
        if (width > 760) {
          assert(formulaSymbols.left >= formulaContent.right - 1
            && Math.abs(formulaSymbols.top - formulaContent.top) < 1,
          "Formula and symbols columns align side by side");
          const targetColumn = doc.querySelector(".condition-grid fieldset + fieldset").getBoundingClientRect();
          assert(Math.abs(formulaSymbols.left - targetColumn.left) < 1,
            "Formula divider aligns with the prototype and target divider");
          const formulaTitle = doc.querySelector("#formula-title").getBoundingClientRect();
          const symbolsTitle = doc.querySelector(".formula-symbols h2").getBoundingClientRect();
          assert(Math.abs(formulaTitle.top - symbolsTitle.top) < 1
            && Math.abs(formulaContent.left + Number.parseFloat(style(doc.querySelector(".formula-content")).paddingLeft)
              - formulaTitle.left) < 1
            && Math.abs(formulaSymbols.left
              + Number.parseFloat(style(doc.querySelector(".formula-symbols")).borderLeftWidth)
              + Number.parseFloat(style(doc.querySelector(".formula-symbols")).paddingLeft)
              - symbolsTitle.left) < 1,
          "Formula and symbol headings start at the same top line with aligned left edges");
          const equations = [...doc.querySelectorAll("#formulas .formula")].map((element) => element.getBoundingClientRect());
          assert(Math.max(...equations.map((rect) => rect.left)) - Math.min(...equations.map((rect) => rect.left)) < 1,
            "Equations are aligned to the same left edge");
        } else {
          assert(formulaSymbols.top >= formulaContent.bottom - 1,
            `Formula symbols stack below equations on narrow screens ${width}`);
        }
        assert(style(doc.querySelector(".setup-panel")).backgroundColor !== style(doc.body).backgroundColor,
          `Calculator setup has a subtle grouped surface ${width}`);
        const notes = doc.querySelector(".calculation-notes");
        assert(notes.tagName === "SECTION" && !notes.querySelector("details, summary")
          && frame.contentWindow.getComputedStyle(notes).display !== "none",
        `Guidance and reminders are always visible ${width}`);
        set("#base-speed", "1200");
        const buttonTop = button.getBoundingClientRect().top;
        submit();
        assert(Math.abs(button.getBoundingClientRect().top - buttonTop) < 1,
          `Calculation status and warning do not shift button ${width}`);
        assert(doc.querySelector("#result-warning").getBoundingClientRect().top >= button.getBoundingClientRect().bottom,
          `Engineering warning stays below button ${width}`);
        const inputBounds = doc.querySelector("#base-speed").closest("fieldset").getBoundingClientRect();
        const resultBounds = doc.querySelector("#target-conditions").getBoundingClientRect();
        if (width > 650) {
          assert(resultBounds.left >= inputBounds.right && Math.abs(resultBounds.top - inputBounds.top) < 1,
            "Desktop inputs and results are side by side");
          const baseFlow = doc.querySelector("#base-flow").getBoundingClientRect();
          const targetFlow = doc.querySelector("#target-flow").getBoundingClientRect();
          assert(Math.abs(baseFlow.top - targetFlow.top) < 1, "Prototype and target flow fields align for comparison");
        } else {
          assert(resultBounds.top >= inputBounds.bottom, `Narrow screen results stack below inputs ${width}`);
        }
      }
      output.textContent = `PASS: ${checks} checks`;
    } catch (error) {
      output.textContent = `FAIL: ${error.message}`;
      console.error(error);
    } finally { frame.remove(); }
  </script>
</body>
</html>
