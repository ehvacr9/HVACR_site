<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>量子運算 HVAC 英文文章回歸測試</title>
</head>
<body>
  <h1>量子運算 HVAC 英文文章回歸測試</h1>
  <p>請以 HTTP 伺服器提供網站；測試文章入口、全文主要段落、表格、參考資料及字典功能。</p>
  <pre id="results" role="status">Running...</pre>
  <script type="module">
    const output = document.querySelector("#results");
    let checks = 0;
    const assert = (condition, label) => {
      checks += 1;
      if (!condition) throw new Error(`FAIL: ${label}`);
    };

    try {
      const [columnsResponse, articleResponse] = await Promise.all([
        fetch("../columns.html?quantum-test=" + Date.now()),
        fetch("../quantum-computing-hvac.html?quantum-test=" + Date.now()),
      ]);
      assert(columnsResponse.ok, "Engineering columns archive responds");
      assert(articleResponse.ok, "Quantum HVAC article responds");

      const columns = new DOMParser().parseFromString(await columnsResponse.text(), "text/html");
      const article = new DOMParser().parseFromString(await articleResponse.text(), "text/html");
      assert(columns.querySelector("h1")?.textContent.trim() === "技術專欄"
        && columns.querySelectorAll("a.column-card").length === 1
        && columns.querySelector('a[href="quantum-computing-hvac.html"] h2')?.textContent.includes("Quantum Computing"),
      "Technical columns index lists only the quantum HVAC article");
      const cover = columns.querySelector('a.column-card[href="quantum-computing-hvac.html"] img.column-cover');
      assert(cover?.getAttribute("src") === "assets/quantum-hvac-cover.svg"
        && cover.getAttribute("width") === "640" && cover.getAttribute("height") === "480",
      "Quantum article card includes its illustrated cover with reserved dimensions");
      const coverResponse = await fetch("../assets/quantum-hvac-cover.svg");
      assert(coverResponse.ok, "Article cover responds");
      const coverDocument = new DOMParser().parseFromString(await coverResponse.text(), "image/svg+xml");
      assert(!coverDocument.querySelector("parsererror")
        && coverDocument.documentElement.localName === "svg",
      "Article cover is a valid SVG");
      const notice = columns.querySelector(".educational-notice");
      assert(notice?.querySelector("h2")?.textContent === "教育用途與使用聲明"
        && notice.textContent.includes("教育、學習與技術交流")
        && notice.textContent.includes("著作權")
        && notice.textContent.includes("專業審查")
        && notice.textContent.includes("外部字典"),
      "Technical columns includes education, copyright, engineering, and external-link notices");
      assert(!article.querySelector(".dek")
        && !article.body.textContent.includes("ASHRAE Journal 英文文章全文。點擊任一英文單字"),
      "Article omits the removed introductory dictionary description");
      assert(article.querySelector("h1")?.textContent.includes("Quantum Computing & The HVAC Industry"),
        "Article has its original title");
      const abstract = article.querySelector(".article-abstract");
      assert(abstract?.querySelector("#abstract-title")?.textContent === "English Abstract"
        && abstract.querySelector("#abstract-zh-title")?.textContent === "中文摘要"
        && abstract.querySelector("h2")?.id === "abstract-title"
        && abstract.querySelector('p[lang="en"]')?.textContent.includes("quantum coherence")
        && abstract.querySelector('p[lang="zh-Hant"]')?.textContent.includes("量子相干性")
        && !abstract.querySelector(".abstract-note")
        && !abstract.textContent.includes("Abstract ／ 摘要"),
      "Article displays English Abstract and Chinese abstract headings with no introductory note");
      assert(article.querySelector(".scroll-top-button[aria-label='捲動到最上方']"),
        "Article includes the scroll-to-top button");

      const text = article.querySelector("#article-text")?.textContent ?? "";
      for (const phrase of [
        "BY MARIO MENDOZA",
        "Environmental Requirements for Quantum Computing Systems",
        "Parallels with High-Tech Laboratory Design",
        "Energy and Sustainability Considerations",
        "Implications for the Construction and HVAC Industries",
        "Digital Tools, Sensing Devices and Simulation",
        "The Human and Economic Dimension",
        "Toward a Framework for Quantum-Facility Design",
        "Conclusion",
        "References",
        "superconducting",
        "trapped-ion",
        "neutral/cold atom",
        "photonic",
        "$55 billion",
      ]) {
        assert(text.includes(phrase), `Article includes ${phrase}`);
      }
      assert(article.querySelector("table caption")?.textContent.includes("TABLE 1")
        && article.querySelectorAll("table tbody tr").length === 4,
      "Article contains the four-architecture comparison table");
      assert(article.querySelectorAll(".article-text > ol:last-of-type > li").length === 16,
        "Article includes all sixteen references");
      assert(article.querySelectorAll('a[href^="https://doi.org/"]').length >= 8,
        "Reference DOI links are clickable");
      assert(!article.querySelector('iframe, embed, object, a[href$=".pdf"]'),
        "Article displays text rather than embedding the source PDF");
      assert(JSON.stringify(Array.from(article.querySelectorAll("#dictionary-picker a"),
        (link) => link.textContent.trim()))
        === JSON.stringify(["Oxford Dictionary", "Cambridge Dictionary",
          "Longman Dictionary", "Collins Dictionary",
          "Merriam-Webster Dictionary"]),
      "Dictionary picker uses consistent short names ending in Dictionary");

      const frame = document.createElement("iframe");
      frame.src = `../quantum-computing-hvac.html?interaction-test=${Date.now()}`;
      frame.title = "Article dictionary interaction test";
      frame.style.cssText = "position:fixed;width:1px;height:1px;opacity:0;pointer-events:none";
      document.body.append(frame);
      await new Promise((resolve, reject) => {
        frame.addEventListener("load", resolve, { once: true });
        frame.addEventListener("error", reject, { once: true });
      });
      const frameDocument = frame.contentDocument;
      assert(frameDocument.querySelectorAll('.article-abstract p[lang="en"] .dictionary-word').length > 0,
        "English abstract supports dictionary lookup");
      const firstWord = frameDocument.querySelector("button.dictionary-word");
      firstWord.dispatchEvent(new frame.contentWindow.MouseEvent("click", { bubbles: true, detail: 1 }));
      assert(!frameDocument.querySelector("#dictionary-picker").hidden
        && frameDocument.querySelector("#oxford-link").href.includes("/definition/english/quantum")
        && frameDocument.querySelector("#cambridge-link").href.includes("/dictionary/english/quantum")
        && frameDocument.querySelector("#longman-link").href.includes("/dictionary/quantum")
        && frameDocument.querySelector("#collins-link").href.includes("/dictionary/english/quantum")
        && frameDocument.querySelector("#merriam-webster-link").href.includes("/dictionary/quantum"),
      "Clicking an article word opens all five dictionary links");
      frameDocument.dispatchEvent(new frame.contentWindow.KeyboardEvent("keydown", {
        key: "Escape",
        bubbles: true,
      }));
      assert(frameDocument.querySelector("#dictionary-picker").hidden
        && firstWord.getAttribute("aria-expanded") === "false",
      "Escape closes the dictionary picker");
      frame.remove();

      output.textContent = `PASS: ${checks} checks`;
    } catch (error) {
      output.textContent = `Error: ${error.message}`;
      throw error;
    }
  </script>
</body>
</html>
