<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AHU 專欄回歸測試</title>
</head>
<body>
  <h1>AHU 專欄回歸測試</h1>
  <p>請以 HTTP 伺服器提供網站；測試首頁專欄入口、文章路由、ASHRAE 來源及核心工程內容。</p>
  <pre id="results" role="status">Running...</pre>
  <script type="module">
    const output = document.querySelector("#results");
    let checks = 0;
    const assert = (condition, label) => {
      checks += 1;
      if (!condition) throw new Error(`FAIL: ${label}`);
    };

    try {
      const [homeResponse, columnsResponse, articleResponse] = await Promise.all([
        fetch("../index.html?ahu-test=" + Date.now()),
        fetch("../columns.html?ahu-test=" + Date.now()),
        fetch("../ahu.html?ahu-test=" + Date.now()),
      ]);
      assert(homeResponse.ok, "Homepage responds");
      assert(columnsResponse.ok, "Engineering columns archive responds");
      assert(articleResponse.ok, "AHU article responds");

      const home = new DOMParser().parseFromString(await homeResponse.text(), "text/html");
      const columns = new DOMParser().parseFromString(await columnsResponse.text(), "text/html");
      const article = new DOMParser().parseFromString(await articleResponse.text(), "text/html");
      assert(home.querySelector('nav a[href="columns.html"]')?.textContent.trim() === "工程專欄",
        "Main navigation links to engineering columns");
      assert(columns.querySelector('a[href="ahu.html"] h2')?.textContent.includes("空氣處理箱 AHU"),
        "Engineering columns archive links to the AHU article");
      assert(article.querySelector(".scroll-top-button[aria-label='捲動到最上方']"),
        "AHU article includes the scroll-to-top button");

      const text = article.body.textContent;
      for (const phrase of [
        "2024 ASHRAE Handbook—HVAC Systems and Equipment",
        "Chapter 4",
        "Air Handling and Distribution",
        "draw-through",
        "blow-through",
        "10,000 m³/h",
        "50.3 kW",
        "VAV",
        "經濟器",
        "防凍",
      ]) {
        assert(text.includes(phrase), `AHU article includes ${phrase}`);
      }
      const diagram = article.querySelector(".ahu-system-diagram");
      assert(diagram?.getAttribute("role") === "img" && diagram.querySelector("title")
        && diagram.querySelector("desc"),
      "AHU system diagram has an accessible title and description");
      for (const stream of ["air-outdoor", "air-return", "air-exhaust", "air-supply"]) {
        assert(diagram.querySelector(`.${stream}`), `System diagram shows the ${stream} route`);
      }
      for (const component of [
        "混風箱", "濾網", "加熱盤管", "冷卻／除濕", "送風機",
        "空調服務區", "冰水供水 CHWS", "冰水回水 CHWR", "冷凝水排水",
      ]) {
        assert(diagram.textContent.includes(component), `System diagram labels ${component}`);
      }
      assert(article.querySelector(".diagram-caption")?.textContent.includes("回風")
        && article.querySelector(".diagram-caption")?.textContent.includes("排氣")
        && article.querySelector(".diagram-caption")?.textContent.includes("不連通"),
      "System diagram caption explains airflow branches and the duct crossover");
      assert(article.querySelectorAll(".checklist li").length === 8,
        "Article includes an eight-step commissioning checklist");
      assert(article.querySelectorAll(".wide-table tbody tr").length === 22,
        "Article includes practical equipment, selection, and diagnostic tables");
      const sections = [
        "purpose", "layout", "components", "airflow", "control",
        "selection", "commissioning", "troubleshooting", "maintenance", "sources",
      ];
      assert(article.querySelectorAll("article section[id]").length === sections.length,
        "Article has ten navigable technical sections");
      assert(sections.every((id) => article.querySelector(`.toc a[href="#${id}"]`)
        && article.querySelector(`#${id}`)),
      "Every table-of-contents link resolves to its article section");
      assert(!article.querySelector('a[href*="reference/ASHRAE"], a[href$=".pdf"]'),
        "Article does not link to handbook PDF files");

      output.textContent = `PASS: ${checks} checks`;
    } catch (error) {
      output.textContent = `Error: ${error.message}`;
      throw error;
    }
  </script>
</body>
</html>
