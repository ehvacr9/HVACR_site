<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>112 exam archive regression tests</title></head>
<body>
  <h1>112 exam archive regression tests</h1>
  <p>Serve the site over HTTP. Verifies the year card, all six subject routes, PDF responses and the existing viewer.</p>
  <pre id="results" role="status">Running...</pre>
  <script type="module">
    const output = document.querySelector("#results");
    const papers = [
      ["electrical", "112190_0604_電工學（包括電機機械.pdf"],
      ["thermodynamics", "112190_0607_熱力學與熱傳學.pdf"],
      ["fluid", "112190_0609_流體力學與流體機械.pdf"],
      ["refrigeration", "112190_0610_冷凍工程與設計.pdf"],
      ["air-conditioning", "112190_0611_空調工程與設計.pdf"],
      ["controls", "112190_0612_冷凍空調自動控制.pdf"],
    ];
    let checks = 0;
    const assert = (condition, label) => {
      checks += 1;
      if (!condition) throw new Error(`FAIL: ${label}`);
    };
    const frame = document.createElement("iframe");
    frame.title = "112 exam viewer test";
    frame.style.cssText = "position:fixed;left:-10000px;width:1100px;height:900px;";
    document.body.append(frame);
    try {
      const years = await fetch("../exam-years.html");
      assert(years.ok, "Year archive responds");
      const yearDocument = new DOMParser().parseFromString(await years.text(), "text/html");
      assert(yearDocument.querySelector('.year-card[href="exam-year-112.html"] h2')?.textContent === "112 年",
        "112 year is available in archive");
      const year = await fetch("../exam-year-112.html", { cache: "no-store" });
      assert(year.ok, "112 subject page responds");
      const subjectDocument = new DOMParser().parseFromString(await year.text(), "text/html");
      assert(!subjectDocument.querySelector(".track-name"), "112 page omits the redundant exam category label");
      assert(subjectDocument.querySelector(".scroll-top-button"),
        "112 subject page includes the scroll-to-top button");
      const cards = [...subjectDocument.querySelectorAll(".subject-card")];
      assert(cards.length === papers.length, "Six subject cards");
      for (const yearNumber of [113, 114]) {
        const response = await fetch(`../exam-year-${yearNumber}.html`, { cache: "no-store" });
        assert(response.ok, `${yearNumber} subject page responds`);
        const document = new DOMParser().parseFromString(await response.text(), "text/html");
        assert(!document.querySelector(".track-name"),
          `${yearNumber} page omits the redundant exam category label`);
        assert(document.querySelector(".scroll-top-button"),
          `${yearNumber} subject page includes the scroll-to-top button`);
      }
      const yearsResponse = await fetch("../exam-years.html", { cache: "no-store" });
      assert(yearsResponse.ok, "Exam year index responds");
      const yearsDocument = new DOMParser().parseFromString(await yearsResponse.text(), "text/html");
      assert(yearsDocument.querySelector(".scroll-top-button"),
        "Exam year index includes the scroll-to-top button");
      const archiveTemplateResponse = await fetch("../exam-year-archive.html", { cache: "no-store" });
      assert(archiveTemplateResponse.ok, "Historical subject-page template responds");
      const archiveTemplate = new DOMParser().parseFromString(await archiveTemplateResponse.text(), "text/html");
      assert(archiveTemplate.querySelector(".scroll-top-button"),
        "Historical subject pages include the scroll-to-top button");
      await new Promise((resolve, reject) => {
        frame.onload = resolve;
        frame.onerror = () => reject(new Error("Unable to open the 114 refrigeration paper viewer"));
        frame.src = `../exam-paper.html?year=114&subject=refrigeration&test=${Date.now()}`;
      });
      const answers = frame.contentDocument.querySelector("[data-reference-answers]");
      assert(answers && !answers.hidden, "114 refrigeration reference answers are shown");
      assert([...answers.querySelectorAll(".answer-item summary")].map((summary) => summary.textContent.trim()).join("|")
        === "第一題|第二題|第三題|第四題",
      "114 refrigeration reference answers contain four clickable question items");
      const firstAnswer = answers.querySelectorAll(".answer-item")[0];
      assert(firstAnswer.querySelectorAll(".answer-step h3").length === 7,
        "114 refrigeration first-question answer follows all seven requested steps");
      assert(firstAnswer.textContent.includes("氨") && firstAnswer.textContent.includes("吸收器")
        && firstAnswer.textContent.includes("精餾器") && firstAnswer.textContent.includes("COP"),
      "114 refrigeration first-question answer explains the ammonia-water cycle and COP");
      assert(firstAnswer.textContent.includes("2021 Handbook—Fundamentals")
        && firstAnswer.textContent.includes("Fig. 22")
        && firstAnswer.textContent.includes("2022 Handbook—Refrigeration")
        && firstAnswer.textContent.includes("氣泡泵"),
      "114 refrigeration first-question answer cites ASHRAE ammonia-water references and distinguishes the hydrogen diffusion refrigerator");
      const absorptionDiagram = firstAnswer.querySelector("#absorption-diagram-title")?.closest("svg");
      const absorptionFlowPaths = [...(absorptionDiagram?.querySelectorAll(".flow") ?? [])].map((path) => path.getAttribute("d"));
      assert(absorptionDiagram?.getAttribute("viewBox") === "0 0 980 560"
        && firstAnswer.textContent.includes("富氨溶液（NH₃多）")
        && firstAnswer.textContent.includes("稀氨（富水）溶液")
        && firstAnswer.textContent.includes("富水回流液 → 發生器")
        && firstAnswer.textContent.includes("水不是獨立的冷媒迴路")
        && firstAnswer.textContent.includes("RHX")
        && firstAnswer.textContent.includes("SCR")
        && absorptionFlowPaths.includes("M100 465 H520 M675 465 H700 V225 H320 V150 H300")
        && absorptionFlowPaths.includes("M520 465 H675")
        && absorptionFlowPaths.includes("M225 171 V255 H600 V420")
        && absorptionFlowPaths.includes("M600 490 V520 H225 V446")
        && absorptionFlowPaths.includes("M472 148 V195 H325 V150 H300"),
      "114 refrigeration first-question diagram shows distinct ammonia-rich, ammonia-poor and water-reflux pipe loops");
      const flowLegend = [...(firstAnswer.querySelectorAll(".answer-flow-legend .answer-flow-swatch") ?? [])]
        .map((swatch) => swatch.classList[1]);
      assert(flowLegend.join("|") === "refrigerant-flow|rich-solution-flow|weak-solution-flow|reflux-flow"
        && [...absorptionDiagram.querySelectorAll(".flow")].every((path) =>
          path.matches(".refrigerant-flow, .rich-solution-flow, .weak-solution-flow, .reflux-flow")),
      "114 refrigeration first-question diagram uses a legend and distinct pipe colors for each fluid circuit");
      const firstEquations = [...firstAnswer.querySelectorAll("math.answer-equation-display")];
      const thermalCop = firstEquations.find((equation) =>
        equation.getAttribute("aria-label").includes("冷凍效果除以發生器驅動熱輸入"));
      const copFraction = thermalCop?.querySelector("mfrac");
      assert(firstEquations.length === 2 && firstEquations.every((equation) => equation.getBoundingClientRect().height > 0)
        && copFraction?.firstElementChild?.textContent === "Q˙e"
        && copFraction.lastElementChild?.textContent === "Q˙g"
        && firstEquations.some((equation) => equation.getAttribute("aria-label").includes("精餾器排熱")),
      "114 refrigeration first-question thermal COP and full-cycle energy balance render as native MathML");
      const thirdAnswer = answers.querySelectorAll(".answer-item")[2];
      assert(thirdAnswer.querySelectorAll(".answer-step h3").length === 7,
        "114 refrigeration third-question answer follows all seven requested steps");
      assert(thirdAnswer.textContent.includes("62.63") && thirdAnswer.textContent.includes("31,315"),
        "114 refrigeration third-question answer includes the calculated heat rejection and area");
      const equations = [...thirdAnswer.querySelectorAll("math.answer-equation-display")];
      assert(equations.length === 7 && equations.every((equation) => equation.getBoundingClientRect().height > 0)
        && equations.some((equation) => equation.querySelector("mfrac")),
      "114 refrigeration formulas are rendered as native MathML");
      const collapseButton = thirdAnswer.querySelector(".answer-collapse");
      const collapseChevron = getComputedStyle(collapseButton, "::after");
      assert(collapseButton?.textContent.trim() === "收起答案"
        && getComputedStyle(collapseButton).color === "rgb(112, 122, 118)"
        && collapseChevron.content !== "none" && collapseChevron.borderTopWidth !== "0px"
        && collapseChevron.transform === "matrix(0.707107, -0.707107, 0.707107, 0.707107, 0, 0)",
      "114 refrigeration solution has a gray collapse button with an upward chevron");
      thirdAnswer.open = true;
      thirdAnswer.querySelector(".answer-collapse").click();
      assert(!thirdAnswer.open, "Answer collapse button closes the expanded question");
      assert([...answers.querySelectorAll(".answer-pending")].length === 2,
        "the two unwritten questions are clearly marked as pending");
      const scrollTopButton = frame.contentDocument.querySelector(".scroll-top-button");
      assert(scrollTopButton && scrollTopButton.hidden, "Scroll-to-top button starts hidden at page top");
      frame.contentWindow.scrollTo({ top: 500, behavior: "auto" });
      await new Promise((resolve) => setTimeout(resolve, 50));
      assert(!scrollTopButton.hidden, "Scroll-to-top button appears after scrolling");
      scrollTopButton.click();
      await new Promise((resolve) => setTimeout(resolve, 600));
      assert(frame.contentWindow.scrollY <= 1, "Scroll-to-top button returns the page to the top");
      await new Promise((resolve, reject) => {
        frame.onload = resolve;
        frame.onerror = () => reject(new Error("Unable to open the 114 electrical paper viewer"));
        frame.src = `../exam-paper.html?year=114&subject=electrical&test=${Date.now()}`;
      });
      assert(frame.contentDocument.querySelector("[data-reference-answers]")?.hidden,
        "114 refrigeration reference answers are hidden for other subjects");
      for (const [subject, filename] of papers) {
        const card = cards.find((item) =>
          new URL(item.getAttribute("href"), new URL("../exam-year-112.html", location.href)).searchParams.get("subject") === subject);
        assert(card && new URL(card.getAttribute("href"), new URL("../exam-year-112.html", location.href)).searchParams.get("year") === "112",
          `${subject} subject link`);
        const response = await fetch(`../assets/exam-questions/${encodeURIComponent(filename)}`);
        assert(response.ok, `${subject} PDF responds`);
        const bytes = new Uint8Array(await response.arrayBuffer());
        assert(bytes.length > 5 && new TextDecoder().decode(bytes.subarray(0, 5)) === "%PDF-",
          `${subject} is a readable PDF`);
        await new Promise((resolve, reject) => {
          frame.onload = resolve;
          frame.onerror = () => reject(new Error(`Unable to open ${subject} viewer`));
          frame.src = `../exam-paper.html?year=112&subject=${encodeURIComponent(subject)}`;
        });
        const paperFrame = frame.contentDocument.querySelector(".pdf-frame");
        assert(frame.contentDocument.querySelector("h1 [data-subject]")?.textContent === card.querySelector("h2").textContent,
          `${subject} viewer title`);
        assert(decodeURIComponent(paperFrame.src).includes(filename), `${subject} viewer selects correct PDF`);
        assert(decodeURIComponent(frame.contentDocument.querySelector("[data-download]").href).includes(filename),
          `${subject} download selects correct PDF`);
      }
      output.dataset.kind = "success";
      output.textContent = JSON.stringify({ status: "PASS", checks, papers: papers.length }, null, 2);
    } catch (error) {
      output.dataset.kind = "error";
      output.textContent = error.stack;
      console.error(error);
    } finally { frame.remove(); }
  </script>
</body>
</html>
