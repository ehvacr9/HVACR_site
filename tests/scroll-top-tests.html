<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Back-to-top regression tests</title></head>
<body>
  <h1>Back-to-top regression tests</h1>
  <p>Serve over HTTP. Checks the tool overview and all five calculators. Use reduced motion for automated runs.</p>
  <pre id="results" role="status">Running...</pre>
  <script type="module">
    const output = document.querySelector("#results");
    const pages = ["tools.html", "fan-laws.html", "humid-air.html", "refrigeration-cycle.html", "unit-converter.html", "water-refrigerant.html"];
    let checks = 0;
    const assert = (condition, label) => {
      checks += 1;
      if (!condition) throw new Error(`FAIL: ${label}`);
    };
    const frame = document.createElement("iframe");
    frame.title = "Back-to-top behavior tests";
    frame.style.cssText = "display:block;width:390px;height:400px;border:0;";
    document.body.append(frame);
    try {
      for (const path of pages) {
        await new Promise((resolve, reject) => {
          frame.onload = resolve;
          frame.onerror = () => reject(new Error(`Unable to load ${path}`));
          frame.src = `../${path}?scroll-test=${Date.now()}`;
        });
        const win = frame.contentWindow;
        const doc = frame.contentDocument;
        const button = doc.querySelector(".scroll-top-button");
        assert(doc.querySelectorAll(".scroll-top-button").length === 1, `${path} has one button`);
        assert(button.getAttribute("aria-label") === "捲動到最上方", `${path} accessible button label`);
        assert(button.hidden, `${path} initially hidden`);
        win.scrollTo({ top: 300, behavior: "instant" });
        win.dispatchEvent(new win.Event("scroll"));
        assert(win.scrollY > 0 && !button.hidden, `${path} shown after scroll`);
        assert(win.getComputedStyle(button).position === "fixed", `${path} fixed positioning`);
        button.click();
        await new Promise((resolve) => setTimeout(resolve, 1200));
        assert(win.scrollY === 0, `${path} returns to page start`);
        win.dispatchEvent(new win.Event("scroll"));
        assert(button.hidden, `${path} hidden again at page start`);
      }
      output.textContent = JSON.stringify({ status: "PASS", checks, pages: pages.length }, null, 2);
    } catch (error) {
      output.textContent = error.stack;
      console.error(error);
    } finally {
      frame.remove();
    }
  </script>
</body>
</html>
