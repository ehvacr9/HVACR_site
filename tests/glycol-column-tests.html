<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>乙二醇專欄回歸測試</title>
</head>
<body>
  <h1>乙二醇專欄回歸測試</h1>
  <p>請以 HTTP 伺服器提供網站；測試首頁專欄入口、文章路由、ASHRAE 引用與核心技術內容。</p>
  <pre id="results" role="status">Running...</pre>
  <script type="module">
    const output = document.querySelector("#results");
    let checks = 0;
    const assert = (condition, label) => {
      checks += 1;
      if (!condition) throw new Error(`FAIL: ${label}`);
    };

    try {
      const [homeResponse, columnsResponse, articleResponse] = await Promise.all([
        fetch("../index.html?glycol-test=" + Date.now()),
        fetch("../columns.html?glycol-test=" + Date.now()),
        fetch("../glycol.html?glycol-test=" + Date.now()),
      ]);
      assert(homeResponse.ok, "Homepage responds");
      assert(columnsResponse.ok, "Column archive responds");
      assert(articleResponse.ok, "Glycol article responds");

      const home = new DOMParser().parseFromString(await homeResponse.text(), "text/html");
      const columns = new DOMParser().parseFromString(await columnsResponse.text(), "text/html");
      const article = new DOMParser().parseFromString(await articleResponse.text(), "text/html");
      assert(article.querySelector(".scroll-top-button[aria-label='捲動到最上方']"),
        "Glycol article includes the scroll-to-top button");
      assert(home.querySelector('nav a[href="columns.html"]')?.textContent.trim() === "工程專欄",
        "Main navigation links to the column archive");
      assert(home.querySelector('a[href="columns.html"].button')?.textContent.includes("閱讀工程專欄"),
        "Homepage has a descriptive column link");
      assert(columns.querySelector('a[href="glycol.html"]')?.textContent.includes("閱讀專欄"),
        "Column archive links to the glycol article");

      const text = article.body.textContent;
      for (const phrase of [
        "ASHRAE Handbook—Fundamentals",
        "31.4–31.5",
        "質量百分比",
        "−14.1 °C",
        "二次冷媒",
        "抑制劑",
        "丙二醇",
        "100 kW",
        "3.589 kJ/(kg·K)",
        "1051.78 kg/m³",
        "19.1 m³/h",
        "全液態",
        "試運轉",
        "自動補水",
        "故障排查",
      ]) {
        assert(text.includes(phrase), `Glycol article includes ${phrase}`);
      }
      const diagram = article.querySelector(".glycol-system-diagram");
      assert(diagram?.getAttribute("role") === "img" && diagram.querySelector("title")
        && diagram.querySelector("desc"),
      "Glycol system diagram has an accessible title and description");
      for (const loopClass of ["cold-solution", "warm-solution"]) {
        assert(diagram.querySelector(`.${loopClass}`), `System diagram shows the ${loopClass} flow`);
      }
      for (const component of [
        "冷凍機／冷卻器", "循環泵", "盤管／製程負載", "膨脹槽",
        "空氣分離器", "供液取樣／測點", "回液取樣／測點",
      ]) {
        assert(diagram.textContent.includes(component), `System diagram labels ${component}`);
      }
      assert(article.querySelector(".diagram-caption")?.textContent.includes("封閉二次冷媒迴路")
        && article.querySelector(".diagram-caption")?.textContent.includes("不與主機內部冷媒混合"),
      "Glycol caption explains the closed secondary-fluid circuit");
      assert(article.querySelectorAll("#selection table tbody tr").length === 3,
        "Article provides three source-based concentration references");
      assert(article.querySelectorAll(".checklist li").length === 17,
        "Article provides commissioning and handover checklists");
      assert(article.querySelectorAll(".diagnostic-table tbody tr").length === 5,
        "Article provides five symptom-based troubleshooting checks");
      assert(article.querySelectorAll("article section[id]").length === 8,
        "Article has eight navigable technical sections");
      assert([...article.querySelectorAll(".toc a")].every((link) =>
        article.querySelector(link.getAttribute("href"))),
      "Table-of-contents links resolve to article sections");
      assert(!article.querySelector('a[href*="reference/ASHRAE"], a[href$=".pdf"]'),
        "Article does not link to handbook PDF files");

      output.textContent = `PASS: ${checks} checks`;
    } catch (error) {
      output.textContent = `Error: ${error.message}`;
      throw error;
    }
  </script>
</body>
</html>
