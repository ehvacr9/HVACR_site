<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全站導覽與專欄回歸測試</title>
</head>
<body>
  <h1>全站導覽與專欄回歸測試</h1>
  <p>請以 HTTP 伺服器提供網站；測試所有頁面的專欄入口及乙二醇專欄路由。</p>
  <pre id="results" role="status">Running...</pre>
  <script type="module">
    const output = document.querySelector("#results");
    let checks = 0;
    const assert = (condition, label) => {
      checks += 1;
      if (!condition) throw new Error(`FAIL: ${label}`);
    };
    const pages = [
      "index.html", "about.html", "founder.html", "terminology.html", "exam-years.html",
      "exam-year-112.html", "exam-year-113.html", "exam-year-114.html", "exam-year-archive.html",
      "exam-paper.html", "humid-air.html", "refrigeration-cycle.html", "tools.html",
      "unit-converter.html", "fan-laws.html", "duct-pressure.html", "moody-chart.html", "fin-efficiency.html", "water-refrigerant.html", "columns.html", "glycol.html", "chiller.html", "mau.html", "ahu.html",
      "ahu-project-case.html", "vrf.html", "low-flow-chiller.html", "quantum-computing-hvac.html",
    ];

    try {
      for (const path of pages) {
        const response = await fetch(`../${path}?navigation-test=${Date.now()}`);
        assert(response.ok, `${path} responds`);
        const page = new DOMParser().parseFromString(await response.text(), "text/html");
        assert(page.querySelector('nav a[href="columns.html"]')?.textContent.trim() === "技術專欄",
          `${path} links to the technical columns`);
        if (path === "columns.html") {
          assert(page.querySelector("h1")?.textContent.trim() === "技術專欄"
            && page.querySelectorAll("a.column-card").length === 1
            && page.querySelector('a.column-card[href="quantum-computing-hvac.html"]'),
          "Technical columns lists only the quantum article");
          assert(!page.querySelector('a[href="glycol.html"], a[href="chiller.html"], a[href="mau.html"], a[href="ahu.html"], a[href="vrf.html"], a[href="low-flow-chiller.html"], a[href="ahu-project-case.html"]'),
            "Other articles are not listed in the technical columns");
        }
        assert(!page.querySelector('nav a[href="references.html"]'),
          `${path} does not expose the bibliography in the site navigation`);
        if (["columns.html", "glycol.html", "chiller.html", "mau.html", "ahu.html", "duct-pressure.html", "moody-chart.html", "fin-efficiency.html",
          "ahu-project-case.html", "vrf.html", "low-flow-chiller.html", "quantum-computing-hvac.html"].includes(path)) {
          assert(page.querySelector(".scroll-top-button[aria-label='捲動到最上方']"),
            `${path} includes the scroll-to-top button`);
        }
      }

      output.textContent = `PASS: ${checks} checks`;
    } catch (error) {
      output.textContent = `Error: ${error.message}`;
      throw error;
    }
  </script>
</body>
</html>
