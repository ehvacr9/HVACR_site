<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Unit converter regression tests</title></head>
<body>
  <h1>Unit converter regression tests</h1>
  <p>Serve the site over HTTP and open this page. Verifies common power units and refrigeration-ton conversions.</p>
  <pre id="results" role="status">Running...</pre>
  <script type="module">
    const output = document.querySelector("#results");
    let checks = 0;
    const assert = (condition, label) => {
      checks += 1;
      if (!condition) throw new Error(`FAIL: ${label}`);
    };
    const frame = document.createElement("iframe");
    frame.title = "Unit converter test";
    frame.style.cssText = "position:fixed;left:-10000px;width:1100px;height:900px;";
    try {
      const response = await fetch("../unit-converter.html", { cache: "no-store" });
      assert(response.ok, "Unit converter page responds");
      const markup = new DOMParser().parseFromString(await response.text(), "text/html");
      assert(markup.querySelector('[data-category="power"]')?.textContent.trim() === "功率",
        "Power is available as a conversion category");
      assert(markup.querySelector(".intro").textContent.includes("功率"),
        "Page introduction lists power conversions");
      document.body.append(frame);
      await new Promise((resolve, reject) => {
        frame.onload = resolve;
        frame.onerror = () => reject(new Error("Unable to load the unit converter"));
        frame.src = `../unit-converter.html?test=${Date.now()}`;
      });
      const doc = frame.contentDocument;
      const clickCategory = (category) => doc.querySelector(`[data-category="${category}"]`).click();
      const convert = (value, from, to) => {
        doc.querySelector("#conversion-value").value = String(value);
        doc.querySelector("#from-unit").value = from;
        doc.querySelector("#to-unit").value = to;
        doc.querySelector("#conversion-value").dispatchEvent(new Event("input", { bubbles: true }));
        return Number(doc.querySelector("#result-value").value);
      };
      clickCategory("power");
      assert(doc.querySelector('[data-category="power"]').getAttribute("aria-pressed") === "true"
        && doc.querySelector("#from-unit").value === "kW"
        && doc.querySelector("#to-unit").value === "RT",
      "Power category selects useful kW-to-RT defaults");
      const wattsPerRefrigerationTon = convert(1, "RT", "kW");
      assert(Math.abs(wattsPerRefrigerationTon - 3.51685284) < 1e-7,
        "One refrigeration ton converts to 3.51685 kW");
      const refrigerationTonsPerKilowatt = convert(1, "kW", "RT");
      assert(Math.abs(refrigerationTonsPerKilowatt - 1 / 3.51685284) < 1e-8,
        "One kW converts to the reciprocal refrigeration-ton capacity");
      assert(Math.abs(convert(1, "hp", "kW") - 0.7456998716) < 1e-8,
        "Mechanical horsepower converts to kW");
      assert(Math.abs(convert(1000, "W", "kW") - 1) < 1e-12
        && Math.abs(convert(1, "MW", "kW") - 1000) < 1e-9,
      "W, kW and MW conversions use consistent SI scaling");
      assert(doc.querySelector("#conversion-hint").textContent.includes("12,000 BTU/h"),
        "Refrigeration ton definition is disclosed to users");
      output.dataset.kind = "success";
      output.textContent = JSON.stringify({ status: "PASS", checks }, null, 2);
    } catch (error) {
      output.dataset.kind = "error";
      output.textContent = error.stack;
      console.error(error);
    } finally {
      frame.remove();
    }
  </script>
</body>
</html>
