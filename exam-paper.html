<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5ef">
  <meta name="description" content="預覽與下載冷凍空調工程技師考試 PDF。">
  <link rel="icon" type="image/svg+xml" href="assets/hvacr-learning-logo.svg?v=3">
  <title>技師考題｜能源與冷凍空調學習網</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172b2b;
      --muted: #5b6c68;
      --paper: #f6f5ef;
      --surface: #fffefa;
      --green: #1d6252;
      --line: #dce2d8;
      --serif: Georgia, "Noto Serif TC", "PMingLiU", serif;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); line-height: 1.7; }
    a { color: inherit; }
    a:focus-visible { outline: 3px solid #9ab952; outline-offset: 4px; }
    .wrap { width: min(1120px, calc(100% - 48px)); margin-inline: auto; }
    .topbar {
      position: sticky; top: 0; z-index: 100; display: flex; width: 100%; max-width: none;
      min-height: 82px; align-items: center; justify-content: space-between; gap: 20px;
      margin-inline: 0; padding-inline: max(24px, calc((100% - 1120px) / 2));
      border-bottom: 1px solid var(--line); background: var(--paper);
    }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); font-size: 15px; font-weight: 750; letter-spacing: .04em; text-decoration: none; }
    .brand-mark { width: 34px; height: 34px; flex: 0 0 34px; object-fit: contain; }
    nav { display: flex; gap: 24px; font-size: 13px; }
    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover, nav a[aria-current="page"] { color: var(--green); }
    .page { min-height: calc(100vh - 152px); padding-block: 58px 82px; }
    .breadcrumb { margin: 0 0 26px; color: var(--muted); font-size: 13px; }
    .eyebrow { display: flex; align-items: center; gap: 10px; margin: 0 0 13px; color: var(--green); font-size: 12px; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
    .eyebrow::before { width: 24px; height: 1px; background: currentColor; content: ""; }
    h1, h2, p { margin-top: 0; }
    h1, h2 { font-family: var(--serif); font-weight: 500; letter-spacing: -.035em; }
    h1 { max-width: 900px; margin-bottom: 18px; font-size: clamp(34px, 5vw, 54px); line-height: 1.25; }
    .intro { margin-bottom: 28px; color: var(--muted); font-size: 15px; }
    .pdf-preview h2 { margin-bottom: 12px; font-size: 23px; }
    .pdf-frame { display: block; width: 100%; height: min(78vh, 980px); min-height: 520px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
    .pdf-fallback { margin: 12px 0 0; color: var(--muted); font-size: 14px; }
    .back { display: inline-block; margin: 24px 24px 0 0; color: var(--green); font-size: 14px; text-underline-offset: 3px; }
    footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .footer-inner { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding-block: 24px; text-align: center; }
    .footer-brand-group { display: flex; min-width: 0; align-items: center; justify-content: center; width: 100%; gap: 12px; }
    .footer-brand-link { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); font-size: 13px; font-weight: 750; text-decoration: none; white-space: nowrap; }
    .footer-brand-link:hover { color: var(--green); }
    .footer-brand-logo { width: 32px; height: 32px; flex: 0 0 32px; object-fit: contain; }
    @media (max-width: 900px) {
      .topbar { flex-wrap: wrap; gap: 10px; padding-block: 12px; }
      nav { flex-wrap: wrap; gap: 8px 20px; }
    }
    @media (max-width: 520px) {
      .wrap { width: calc(100% - 32px); }
      .topbar { padding-inline: 16px; }
      .brand { gap: 8px; font-size: 13px; }
      nav { width: 100%; justify-content: space-between; gap: 6px; font-size: 12px; }
      .page { padding-block: 40px 58px; }
      .pdf-frame { height: 72vh; min-height: 420px; }
      .footer-inner { flex-direction: column; gap: 4px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="wrap topbar">
    <a class="brand" href="index.html" aria-label="回到能源與冷凍空調學習網首頁">
      <img class="brand-mark" src="assets/hvacr-learning-logo.svg?v=3" alt="">
      <span>能源與冷凍空調學習網</span>
    </a>
    <nav aria-label="主選單">
      <a href="index.html">首頁</a>
      <a href="about.html">關於我們</a>
      <a href="exam-years.html" aria-current="page">技師考題</a>
      <a href="terminology.html">術語辭典</a>
      <a href="tools.html">計算工具</a>
    </nav>
  </header>
  <main class="wrap page">
    <p class="breadcrumb"><a href="index.html">首頁</a> ／ <a href="exam-years.html">技師考題</a> ／ <a data-year-link><span data-year></span> 年</a> ／ <span data-subject></span></p>
    <p class="eyebrow">Exam Paper · <span data-year></span></p>
    <h1><span data-subject></span></h1>
    <p class="intro"><span data-exam-description></span></p>
    <section class="pdf-preview" aria-labelledby="pdf-preview-title">
      <h2 id="pdf-preview-title">線上預覽</h2>
      <iframe class="pdf-frame" title="技師考題 PDF 預覽"></iframe>
      <p class="pdf-fallback">若此瀏覽器無法顯示內嵌 PDF，請<a data-open target="_blank" rel="noopener">在新分頁開啟考題 PDF</a>，或<a data-download>下載 PDF</a>。</p>
    </section>
    <a class="back" data-year-link>← 返回 <span data-year></span> 年考科</a>
    <a class="back" href="exam-years.html">返回年度選單</a>
  </main>
  <footer>
    <div class="wrap footer-inner">
      <div class="footer-brand-group">
        <a class="footer-brand-link" href="index.html" aria-label="能源與冷凍空調學習網首頁">
          <img class="footer-brand-logo" src="assets/hvacr-learning-logo.svg?v=3" alt="">
          <span>能源與冷凍空調學習網</span>
        </a>
      </div>
      <span>Copyright © 2026 能源與冷凍空調學習網. All rights reserved.</span>
    </div>
  </footer>
  <script>
    const paperSets = {
      "112": {
        examName: "112年專門職業及技術人員高等考試冷凍空調工程技師考試",
        papers: {
          electrical: { title: "電工學（包括電機機械）", filename: "112190_0604_電工學（包括電機機械.pdf" },
          thermodynamics: { title: "熱力學與熱傳學", filename: "112190_0607_熱力學與熱傳學.pdf" },
          fluid: { title: "流體力學與流體機械", filename: "112190_0609_流體力學與流體機械.pdf" },
          refrigeration: { title: "冷凍工程與設計", filename: "112190_0610_冷凍工程與設計.pdf" },
          "air-conditioning": { title: "空調工程與設計", filename: "112190_0611_空調工程與設計.pdf" },
          controls: { title: "冷凍空調自動控制", filename: "112190_0612_冷凍空調自動控制.pdf" }
        }
      },
      "113": {
        examName: "113年專門職業及技術人員高等考試建築師、32類科技師（含第二次食品技師）、大地工程技師考試分階段考試（第二階段考試）暨普通考試不動產經紀人、記帳士考試",
        papers: {
          electrical: { title: "電工學（包括電機機械）", filename: "113190_0604_電工學（包括電機機械.pdf" },
          thermodynamics: { title: "熱力學與熱傳學", filename: "113190_0609_熱力學與熱傳學.pdf" },
          fluid: { title: "流體力學與流體機械", filename: "113190_0612_流體力學與流體機械.pdf" },
          refrigeration: { title: "冷凍工程與設計", filename: "113190_0613_冷凍工程與設計.pdf" },
          "air-conditioning": { title: "空調工程與設計", filename: "113190_0614_空調工程與設計.pdf" },
          controls: { title: "冷凍空調自動控制", filename: "113190_0615_冷凍空調自動控制.pdf" }
        }
      },
      "114": {
        examName: "114年專門職業及技術人員高等考試建築師、25類科技師（含第二次食品技師）、大地工程技師考試分階段考試（第二階段考試）暨普通考試不動產經紀人、記帳士考試",
        papers: {
          electrical: { title: "電工學（包括電機機械）", filename: "114180_0604_電工學（包括電機機械.pdf" },
          thermodynamics: { title: "熱力學與熱傳學", filename: "114180_0607_熱力學與熱傳學.pdf" },
          fluid: { title: "流體力學與流體機械", filename: "114180_0609_流體力學與流體機械.pdf" },
          refrigeration: { title: "冷凍工程與設計", filename: "114180_0610_冷凍工程與設計.pdf" },
          "air-conditioning": { title: "空調工程與設計", filename: "114180_0611_空調工程與設計.pdf" },
          controls: { title: "冷凍空調自動控制", filename: "114180_0612_冷凍空調自動控制.pdf" }
        }
      }
    };
    const params = new URLSearchParams(location.search);
    const year = params.get("year");
    const subjectId = params.get("subject");
    const eventId = params.get("exam");
    const yearNumber = Number(year);
    const isHistoricalYear = Number.isInteger(yearNumber) && yearNumber >= 90 && yearNumber <= 111;
    const yearData = Object.prototype.hasOwnProperty.call(paperSets, year)
      ? paperSets[year]
      : null;
    const yearPageUrl = isHistoricalYear
      ? `exam-year-archive.html?year=${yearNumber}`
      : `exam-year-${year}.html`;

    async function renderPaper() {
      let paper = yearData && Object.prototype.hasOwnProperty.call(yearData.papers, subjectId)
        ? yearData.papers[subjectId]
        : null;
      let eventData = null;

      if (isHistoricalYear) {
        try {
          const response = await fetch("assets/exam-questions/exam-archive-90-111.json");
          if (!response.ok) throw new Error(`Archive request failed (${response.status})`);
          const archive = await response.json();
          const events = archive[String(yearNumber)]?.events ?? [];
          eventData = events.find((event) => event.code === eventId) ?? null;
          paper = eventData?.papers.find((item) => item.id === subjectId) ?? null;
        } catch (error) {
          console.error("Unable to load the historical exam archive.", error);
          document.querySelector("[data-exam-description]").textContent = "考題資料載入失敗，請稍後重試。";
          return;
        }
      }

      if (!paper) {
        location.replace(isHistoricalYear ? yearPageUrl : yearData ? yearPageUrl : "exam-years.html");
        return;
      }

      const fileUrl = `assets/exam-questions/${paper.filename}`;
      document.querySelectorAll("[data-year]").forEach((element) => {
        element.textContent = year;
      });
      document.querySelectorAll("[data-year-link]").forEach((element) => {
        element.href = yearPageUrl;
      });
      document.querySelectorAll("[data-subject]").forEach((element) => {
        element.textContent = paper.title;
      });
      document.querySelector("[data-exam-description]").textContent = eventData
        ? `${eventData.eventName}｜冷凍空調工程技師`
        : `${year} 年專技高考｜冷凍空調工程技師`;
      document.title = `${year} 年${paper.title}｜冷凍空調工程技師考題`;
      document.querySelector(".pdf-frame").src = `${fileUrl}#view=FitH`;
      document.querySelector(".pdf-frame").title = `${year} 年${paper.title} PDF 預覽`;
      document.querySelector("[data-open]").href = fileUrl;
      const downloadLink = document.querySelector("[data-download]");
      downloadLink.href = fileUrl;
      downloadLink.download = `${year}年${eventData ? `${eventData.code}_` : ""}${paper.title}考題.pdf`;
    }

    renderPaper();
  </script>
</body>
</html>
